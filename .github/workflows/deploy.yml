name: Deploy to Cloudflare Pages

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - run: npm run build

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=bishopric-hub --branch=main

      # workers/mailer/wrangler.jsonc is gitignored (it holds the D1 database_id, same
      # policy as the root wrangler.jsonc — see README) so it doesn't exist in this
      # checkout. Generate it from the committed .example here instead of committing it.
      # Skips (rather than fails the build) until CLOUDFLARE_D1_DATABASE_ID is added as
      # a repo secret — see README's "action-item mailer" section.
      - name: Configure mailer Worker
        id: mailer_config
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}" ]; then
            echo "CLOUDFLARE_D1_DATABASE_ID secret not set — skipping mailer Worker deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            sed -e "s/YOUR_DATABASE_NAME/bishopric-hub-db/" \
                -e "s/YOUR_DATABASE_ID/${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}/" \
                workers/mailer/wrangler.jsonc.example > workers/mailer/wrangler.jsonc
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: cloudflare/wrangler-action@v3
        if: steps.mailer_config.outputs.ready == 'true'
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config workers/mailer/wrangler.jsonc
